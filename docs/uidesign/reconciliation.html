<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finlite — 对账中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #ffffff;
  --fg: #111111;
  --accent: #1677ff;
  --surface: #f7f8fa;
  --muted: #6b7280;
  --border: #d9dee7;

  /* Derived state colors via oklch — not hex literals */
  --ok: oklch(0.62 0.17 145);
  --ok-bg: oklch(0.96 0.03 145);
  --ok-border: oklch(0.80 0.08 145);
  --warn: oklch(0.72 0.14 75);
  --warn-bg: oklch(0.96 0.05 75);
  --warn-border: oklch(0.85 0.08 75);
  --err: oklch(0.58 0.20 25);
  --err-bg: oklch(0.95 0.04 25);
  --err-border: oklch(0.78 0.10 25);

  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
  --radius: 8px;
  --sidebar-w: 220px;
  --topbar-h: 52px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5715;
  color: var(--fg);
  background: var(--surface);
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── App Shell ── */
.app { display: flex; height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  background: var(--bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-brand {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
  font-size: 16px;
  color: var(--fg);
}
.sidebar-brand .logo-dot {
  width: 24px; height: 24px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; font-weight: 700;
}
.sidebar-nav { flex: 1; padding: 8px 0; overflow-y: auto; }
.nav-section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  padding: 12px 16px 4px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  font-size: 13px;
  color: var(--fg);
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  transition: background 0.15s;
  font-family: var(--font);
}
.nav-item:hover { background: var(--surface); }
.nav-item.active {
  background: var(--surface);
  color: var(--accent);
  font-weight: 600;
  position: relative;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
}
.nav-icon {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.7;
}
.nav-item.active .nav-icon { opacity: 1; }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
}

/* ── Main Area ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  height: var(--topbar-h);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
}
.topbar-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-period {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}
.topbar-period strong { color: var(--fg); font-weight: 600; }

/* ── Content ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 14px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover {
  background: oklch(0.55 0.22 255);
  border-color: oklch(0.55 0.22 255);
  color: #fff;
}
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn-ghost { border-color: transparent; background: none; }
.btn-ghost:hover { background: var(--surface); border-color: transparent; color: var(--accent); }

/* ── Stat Cards ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
}
.stat-label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 6px;
}
.stat-value {
  font-size: 26px;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.stat-value .unit { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.stat-trend {
  font-size: 12px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.stat-trend.ok { color: var(--ok); }
.stat-trend.warn { color: var(--warn); }

/* ── Toolbar ── */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}
.toolbar-left { display: flex; align-items: center; gap: 12px; }
.toolbar-right { display: flex; align-items: center; gap: 8px; }

.filter-select, .filter-input {
  height: 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 12px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--fg);
  background: var(--bg);
  cursor: pointer;
}
.filter-select:focus-visible, .filter-input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
  border-color: var(--accent);
}

.tab-group {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.tab-btn {
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 500;
  border: none;
  background: var(--bg);
  color: var(--muted);
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.15s;
}
.tab-btn:hover { color: var(--fg); background: var(--surface); }
.tab-btn.active {
  background: var(--accent);
  color: #fff;
}
.tab-btn + .tab-btn { border-left: 1px solid var(--border); }
.tab-btn.active + .tab-btn { border-left-color: var(--accent); }
.tab-btn + .tab-btn.active { border-left-color: var(--accent); }
.tab-count {
  display: inline-block;
  min-width: 18px;
  padding: 0 5px;
  height: 18px;
  line-height: 18px;
  text-align: center;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 600;
  margin-left: 4px;
  background: var(--surface);
  color: var(--muted);
}
.tab-btn.active .tab-count { background: rgba(255,255,255,0.25); color: #fff; }

/* ── Recon Table ── */
.recon-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.recon-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.recon-table thead th {
  background: var(--surface);
  color: var(--muted);
  font-weight: 600;
  font-size: 12px;
  text-align: left;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  user-select: none;
}
.recon-table thead th.num { text-align: right; }
.recon-table thead th.center { text-align: center; }
.recon-table tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--fg);
  vertical-align: middle;
}
.recon-table tbody td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  font-size: 13px;
}
.recon-table tbody tr:last-child td { border-bottom: none; }
.recon-table tbody tr { cursor: pointer; transition: background 0.12s; }
.recon-table tbody tr:hover { background: var(--surface); }
.recon-table tbody tr.expanded { background: var(--surface); }
.recon-table tbody tr.diff-row td { background: var(--warn-bg); }
.recon-table tbody tr.diff-row:hover td { background: oklch(0.94 0.06 75); }

.date-cell {
  font-weight: 600;
  font-size: 13px;
}
.date-cell .weekday {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
  margin-left: 4px;
}

/* ── Status Badges ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-ok {
  background: var(--ok-bg);
  color: oklch(0.40 0.12 145);
  border: 1px solid var(--ok-border);
}
.badge-warn {
  background: var(--warn-bg);
  color: oklch(0.45 0.11 75);
  border: 1px solid var(--warn-border);
}
.badge-pending {
  background: var(--surface);
  color: var(--muted);
  border: 1px solid var(--border);
}
.badge-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.badge-ok .badge-dot { background: var(--ok); }
.badge-warn .badge-dot { background: var(--warn); }
.badge-pending .badge-dot { background: var(--muted); }

/* ── Drill-down Panel ── */
.drill-row td { padding: 0 !important; border-bottom: none !important; }
.drill-panel {
  padding: 16px 24px 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.drill-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
}
.drill-col {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.drill-col-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--fg);
}
.drill-col-header .source-tag {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 4px;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--border);
}
.drill-col-table {
  width: 100%;
  font-size: 12px;
  border-collapse: collapse;
}
.drill-col-table td {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--fg);
  vertical-align: top;
}
.drill-col-table tr:last-child td { border-bottom: none; }
.drill-col-table td.label { color: var(--muted); white-space: nowrap; width: 70px; }
.drill-col-table td.val {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.drill-col-table td.val.fg-accent { color: var(--accent); font-weight: 600; }
.drill-col-table tr.summary-row td {
  border-top: 2px solid var(--border);
  font-weight: 600;
  padding-top: 8px;
}
.drill-col-table tr.summary-row td.val { font-size: 13px; }

.diff-detail {
  margin-top: 12px;
  padding: 12px 16px;
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  border-radius: var(--radius);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.diff-detail-icon {
  flex-shrink: 0;
  width: 20px; height: 20px;
  margin-top: 1px;
}
.diff-detail-text {
  flex: 1;
  font-size: 12px;
  line-height: 1.6;
  color: oklch(0.40 0.10 75);
}
.diff-detail-text strong { font-weight: 600; }
.diff-detail-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

/* ── Expand indicator ── */
.expand-icon {
  display: inline-flex;
  transition: transform 0.2s;
  color: var(--muted);
}
tr.expanded .expand-icon { transform: rotate(90deg); }

/* ── Footer summary ── */
.recon-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
}
.recon-footer .footer-totals {
  display: flex;
  gap: 24px;
}
.recon-footer .footer-totals span strong {
  color: var(--fg);
  font-weight: 600;
  font-family: var(--mono);
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="app" data-od-id="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" data-od-id="sidebar-nav">
    <div class="sidebar-brand">
      <span class="logo-dot">F</span>
      <span>Finlite</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">业务流程</div>
      <button class="nav-item" data-od-id="nav-import">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0L5 7m3 3l3-3M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1"/></svg>
        </span>
        导入中心
      </button>
      <button class="nav-item" data-od-id="nav-bank">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6l6-4 6 4M3 6v6h10V6M5 8v3M8 8v3M11 8v3"/></svg>
        </span>
        银行流水
      </button>
      <button class="nav-item" data-od-id="nav-order">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 6h6M5 9h4"/></svg>
        </span>
        订单流水
      </button>
      <button class="nav-item active" data-od-id="nav-recon">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8l3 3 7-7"/></svg>
        </span>
        对账中心
      </button>
      <button class="nav-item" data-od-id="nav-summary">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 13h12M4 13V6M8 13V3M12 13V8"/></svg>
        </span>
        数据汇总
      </button>
      <div class="nav-section-label">会计核算</div>
      <button class="nav-item" data-od-id="nav-voucher">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M5 5h6M5 8h6M5 11h3"/></svg>
        </span>
        凭证管理
      </button>
      <button class="nav-item" data-od-id="nav-balance">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h8"/></svg>
        </span>
        科目余额表
      </button>
      <div class="nav-section-label">系统</div>
      <button class="nav-item" data-od-id="nav-settings">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2"/><path d="M8 1v2m0 10v2M1 8h2m10 0h2M3 3l1.5 1.5M11.5 11.5L13 13M3 13l1.5-1.5M11.5 4.5L13 3"/></svg>
        </span>
        基础设置
      </button>
    </nav>
    <div class="sidebar-footer">
      锦绣健康管理 · 单账套
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <!-- Topbar -->
    <header class="topbar" data-od-id="topbar">
      <div class="topbar-title">对账中心</div>
      <div class="topbar-right">
        <div class="topbar-period">
          会计期间：<strong>2026年7月</strong>
        </div>
        <button class="btn btn-sm" data-od-id="btn-export">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 10V2m0 0L5 5m3-3l3 3M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1"/></svg>
          导出对账单
        </button>
        <button class="btn btn-sm btn-primary" data-od-id="btn-recon-run">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8l3 3 7-7"/></svg>
          重新对账
        </button>
      </div>
    </header>

    <!-- Content -->
    <div class="content" data-od-id="recon-view">

      <!-- Stat Cards -->
      <div class="stats-row">
        <div class="stat-card" data-od-id="stat-total">
          <div class="stat-label">对账总金额（POS 实收）</div>
          <div class="stat-value">28,573.68<span class="unit">元</span></div>
          <div class="stat-trend ok">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l3 3 7-7"/></svg>
            5 个结算日已核对
          </div>
        </div>
        <div class="stat-card" data-od-id="stat-matched">
          <div class="stat-label">已匹配</div>
          <div class="stat-value">4<span class="unit">/ 5 天</span></div>
          <div class="stat-trend ok">三方勾稽一致</div>
        </div>
        <div class="stat-card" data-od-id="stat-diff">
          <div class="stat-label">差异待处理</div>
          <div class="stat-value" style="color: var(--warn);">1<span class="unit" style="color: var(--warn);">笔</span></div>
          <div class="stat-trend warn">差异金额 0.45 元</div>
        </div>
        <div class="stat-card" data-od-id="stat-pending">
          <div class="stat-label">待汇总生成</div>
          <div class="stat-value">3<span class="unit">天</span></div>
          <div class="stat-trend" style="color: var(--muted);">已匹配但未制凭证</div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="tab-group" data-od-id="tab-status">
            <button class="tab-btn active" data-filter="all">全部<span class="tab-count">5</span></button>
            <button class="tab-btn" data-filter="matched">已匹配<span class="tab-count">4</span></button>
            <button class="tab-btn" data-filter="diff">差异<span class="tab-count">1</span></button>
          </div>
        </div>
        <div class="toolbar-right">
          <select class="filter-select" data-od-id="filter-period">
            <option>2026年7月</option>
            <option>2026年6月</option>
          </select>
          <input class="filter-input" type="text" placeholder="搜索日期 / 金额" style="width: 160px;" data-od-id="filter-search" />
        </div>
      </div>

      <!-- Reconciliation Table -->
      <div class="recon-card" data-od-id="recon-table-card">
        <table class="recon-table" data-od-id="recon-table">
          <thead>
            <tr>
              <th style="width: 28px;"></th>
              <th>结算日期</th>
              <th class="num">订单实收合计</th>
              <th class="num">银行 POS 转入</th>
              <th class="num">汇总实际收入</th>
              <th class="num">差异</th>
              <th class="center">状态</th>
              <th style="width: 80px;">操作</th>
            </tr>
          </thead>
          <tbody id="recon-tbody">
